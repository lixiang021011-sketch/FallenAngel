plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fallenangel.overlaybeat'
    compileSdk 33
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "com.fallenangel.overlaybeat"
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName "0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // org.json ships with Android but not with a desktop JVM, and the chart
    // reader is worth testing against the real charts without a device.
    testImplementation 'org.json:json:20240303'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.forkOptions.jvmArgs += ['-Duser.language=en', '-Duser.country=US', '-Dfile.encoding=UTF-8']
    options.compilerArgs += ['-Xlint:all', '-Xlint:-serial', '-Xlint:-options']
}
