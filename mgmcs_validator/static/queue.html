<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGMCS · 听审队列</title>
<!-- Reads static/timing_health.json (tools/docs/timing_health_table.py --write).
     bump ?v= whenever queue.js changes: a fix that is not loaded is not a fix. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 20px 40px; background: #0d1117; color: #e6edf3;
         font: 14px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  a { color: #6ea8fe; text-decoration: none; } a:hover { text-decoration: underline; }
  .muted { color: #8b949e; }
  .bad { color: #ff8b8b; }
  header.top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .middle { flex: 1; color: #8b949e; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; margin-top: 14px; }
  .card { border: 1px solid #21262d; border-radius: 10px; background: #11161d; padding: 14px 16px; }
  .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .idx { font-variant-numeric: tabular-nums; color: #8b949e; }
  .badge { font-size: 12px; border: 1px solid #30363d; border-radius: 999px; padding: 2px 9px; color: #c9d1d9; }
  .badge.muted { color: #8b949e; }
  .card h2 { font-size: 16px; margin: 8px 0 2px; }
  .card .when { margin: 2px 0 8px; color: #c9d1d9; font-variant-numeric: tabular-nums; }
  .card .question { margin: 0 0 10px; color: #e3b341; }
  ul.pairs { margin: 0 0 8px 18px; padding: 0; }
  ul.pairs li { margin-bottom: 3px; }
  .back { color: #79d18a; margin: 4px 0; }
  .suspicion { color: #e3b341; }
  .links { margin: 10px 0 0; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  button { background: #1b222c; color: #e6edf3; border: 1px solid #30363d; border-radius: 8px;
           padding: 7px 12px; cursor: pointer; font-size: 13.5px; }
  button:hover { background: #232c38; }
  button.real { border-color: #f8514966; color: #ff9b95; }
  button.fine { border-color: #2ea04366; color: #79d18a; }
  button.unclear { border-color: #d2992266; color: #e3b341; }
  label.opt { display: inline-flex; gap: 5px; align-items: center; color: #c9d1d9; }
  select { background: #1b222c; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 5px 8px; }
  #status, #verdict-state, #tally { color: #8b949e; font-size: 13px; }
  aside { border: 1px solid #21262d; border-radius: 10px; background: #11161d; padding: 10px 12px;
          max-height: 78vh; overflow: auto; }
  aside h2 { font-size: 13px; margin: 0 0 8px; color: #98a2b3; }
  ul.queue { list-style: none; margin: 0; padding: 0; }
  ul.queue button { display: grid; grid-template-columns: 18px 1fr 48px 1fr; gap: 6px; width: 100%;
                    text-align: left; background: none; border: 0; border-radius: 6px; padding: 4px 6px;
                    color: #c9d1d9; font-size: 12.5px; }
  ul.queue button:hover { background: #161b22; }
  ul.queue .now button { background: #1b222c; color: #fff; }
  ul.queue .done button { color: #6f7a86; }
  ul.queue .mark { color: #e3b341; }
  ul.queue .when { font-variant-numeric: tabular-nums; color: #8b949e; }
  ul.queue .kind { color: #8b949e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  pre#log { white-space: pre-wrap; color: #c9d1d9; font-size: 12px; margin: 8px 0 0; }
  audio { width: 100%; margin-top: 12px; }
</style>
</head>
<body>

<header class="top">
  <h1>MGMCS · 听审队列</h1>
  <span class="middle" id="intro">读 timing_health.json…</span>
  <a href="timing.html">体检表</a>
  <a href="index.html">验证器</a>
  <a href="songs.html">歌单</a>
</header>

<main>
  <section>
    <div class="card" id="card"></div>
    <div class="controls">
      <button id="play">▶ 播放这一段</button>
      <button id="replay">↺ 重播</button>
      <button id="prev">← 上一处</button>
      <button id="next">下一处 →</button>
      <label class="opt"><input type="checkbox" id="loop">循环这一段</label>
      <label class="opt">速度
        <select id="rate">
          <option value="1">1×</option>
          <option value="0.75">0.75×</option>
          <option value="0.5">0.5×</option>
        </select>
      </label>
      <label class="opt">看哪些
        <select id="scope">
          <option value="human" selected>分诊没解释掉的（默认）</option>
          <option value="first">第一遍：每类挑一处</option>
          <option value="all">全部（含已自动解释的）</option>
        </select>
      </label>
    </div>
    <div class="controls">
      <button class="real" id="v-real">1 · 真问题</button>
      <button class="fine" id="v-fine">2 · 不是问题</button>
      <button class="unclear" id="v-unclear">3 · 说不清</button>
      <span id="verdict-state"></span>
    </div>
    <audio id="audio" preload="metadata"></audio>
    <p id="status"></p>
  </section>

  <aside>
    <h2>队列（★ = 第一遍）</h2>
    <p id="tally"></p>
    <ul class="queue" id="list"></ul>
    <p><button id="copy">复制已判清单</button></p>
    <pre id="log"></pre>
  </aside>
</main>

<script src="queue.js?v=2"></script>
</body>
</html>
